<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUADSI Pulse</title>
  <link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Manrope:wght@500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0f5a2d">
</head>
<body>
 <h1 class="brand">FUADSI <span>Pulse</span></h1>
  <p id="current-user">Not logged in</p>
  
  
<div id="auth-screen">

  <div id="signup-box">
    <h2>Sign Up</h2>
    <input type="email" id="signup-email" placeholder="Email">
<div class="password-wrap">
   <input type="password" id="signup-password" placeholder="Password">
   <button type="button" class="eye" onclick="togglePassword('signup-password', this)">👁</button>
</div>
    <input type="text" id="signup-matric" placeholder="Matric Number ">
    <button onclick="signUp()">Create Account</button>
    <p id="auth-output"></p>
    <p>Already have an account? <a href="#" onclick="showLogin()">Log in</a></p>
  </div>

  <div id="login-box" class="hidden">
    <h2>Log In</h2>
    <input type="email" id="login-email" placeholder="Email">
<div class="password-wrap">
   <input type="password" id="login-password" placeholder="Password">
   <button type="button" class="eye" onclick="togglePassword('login-password', this)">👁</button>
</div>
    <button onclick="logIn()">Log In</button>
    <p id="login-output"></p>
    <p>New here? <a href="#" onclick="showSignup()">Create an account</a></p>
  </div>

</div>

<div id="app-screen" class="hidden">
<button class="logout" onclick="logOut()">Log Out</button>
   
<section class="important hidden" id="important-banner">
  <span class="important-tag">📌 Important</span>
  <p class="important-text" id="important-text"></p>
</section>

<section id="today">
  <h2>Today</h2>
  <div id="feed-items">Loading...</div>
</section>

<div id="lecturer-tools" class="hidden">
   <h2>Post Announcement (Lecturers only)</h2>
   <textarea id="announcement-content" placeholder="Write your announcement..."></textarea>
   <select id="announcement-type">
  <option value="general">General Announcement</option>
  <option value="class_update">Class Update (schedule/venue/topic)</option>
  <option value="test">Upcoming Test</option>
  <option value="deadline">Assignment Deadline</option>
</select>
<input type="datetime-local" id="announcement-date">
<button onclick="postAnnouncement()">Post</button>
<p id="post-output"></p>
</div>
<h2>Announcements Feed</h2>
<div id="announcements-feed">Loading feed...</div>

</div>
 
 
 

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log('Service worker registered'))
    .catch((err) => console.error('Service worker registration failed:', err));
}
</script>

  

</body>
</html>
